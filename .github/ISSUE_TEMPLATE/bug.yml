name: Bug
description: Something does not work as expected.
labels: ["type:bug"]
body:
  - type: markdown
    attributes:
      value: "**No personal data.** Do not paste names, addresses, ID numbers, tokens or links with a token."
  - type: dropdown
    id: tool
    attributes:
      label: AI tool
      options: [Gemini, Claude, Copilot, Not tool-specific]
    validations:
      required: true
  - type: dropdown
    id: plan
    attributes:
      label: Plan
      options: [free, paid, education, unknown]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Skill version
      description: Ask the companion "which version are you?"
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log row (if relevant)
      description: action, result and time only. Remove the token and any personal values.
