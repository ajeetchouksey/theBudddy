name: Facts
description: Add, fix or retire a fact in the knowledge packs.
labels: ["type:facts", "needs-source"]
body:
  - type: input
    id: topic
    attributes:
      label: Topic
      placeholder: anmeldung
    validations:
      required: true
  - type: dropdown
    id: layer
    attributes:
      label: Layer
      options: [national, state, city, university]
    validations:
      required: true
  - type: input
    id: scope
    attributes:
      label: Scope
      placeholder: de, schleswig-holstein, kiel, cau
    validations:
      required: true
  - type: input
    id: entry
    attributes:
      label: Entry ID (if changing an existing fact)
      placeholder: kiel.anmeldung.office
  - type: input
    id: source
    attributes:
      label: Official source URL
      description: Federal, state, city or university site, AStA or Studierendenwerk. No blogs or forums. The needs-source label is removed once this is filled.
  - type: textarea
    id: details
    attributes:
      label: What is wrong or missing
    validations:
      required: true
