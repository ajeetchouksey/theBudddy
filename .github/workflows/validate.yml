# Every PR: format, schemas, content, skill and adapter rules, links, tests, build.
# docs/devops-system.md (Quality gates) and docs/tech-stack-development.md (CI/CD workflows).
name: validate

on:
  pull_request:
  workflow_dispatch:

permissions: read-all

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install tools
        run: python -m pip install -r requirements-dev.txt
      - name: Lint Python
        run: ruff check scripts tests
      - name: Validate (yamllint, schemas, content, skill and adapter rules)
        run: python scripts/validate.py
      - name: Check source links of changed facts
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python scripts/check_links.py --base "origin/$BASE_REF"
      - name: Python tests
        run: python -m pytest --cov --cov-report=term-missing
      - name: JS tooling (Prettier, Apps Script tests)
        run: |
          npm ci --no-audit --no-fund
          npm run format:check
          npm test
      - name: Build
        run: python scripts/build.py

  # Same rules as on main: fails while any pack entry has an empty reviewer or an adapter is
  # stale. Agent and draft PRs show red here until a human reviewer sets reviewer.
  # Make this a required check together with "checks".
  ready-to-merge:
    name: ready-to-merge
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GSC_BRANCH: main
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install tools
        run: python -m pip install -r requirements-dev.txt
      - name: Validate with main-branch rules
        run: python scripts/validate.py

  fact-diff:
    name: fact-diff
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install tools
        run: python -m pip install -r requirements-dev.txt
      - name: Build the fact diff
        id: diff
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if git diff --quiet "origin/$BASE_REF...HEAD" -- knowledge; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python scripts/fact_diff.py --base "origin/$BASE_REF" --out fact-diff.md
          cat fact-diff.md >> "$GITHUB_STEP_SUMMARY"
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Comment on the PR
        if: steps.diff.outputs.changed == 'true'
        # PRs from forks get a read-only token; the job summary still shows the diff.
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('fact-diff.md', 'utf8');
            const marker = '<!-- fact-diff -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments,
              { owner, repo, issue_number, per_page: 100 });
            const mine = comments.find(c => c.user?.type === 'Bot' && c.body?.startsWith(marker));
            if (mine) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
